<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pro Glass Jump</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 650px;
            background-color: #1a1a1a;
            border: 3px solid #ff6600;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 18, 18, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
            z-index: 10;
        }
        h1 { 
            color: #ff6600; 
            font-size: 28px; 
            font-weight: 800;
            margin-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p { color: #cccccc; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
        .btn {
            background-color: #ff6600;
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 102, 0, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }
        .btn:active { background-color: #e05500; }
        .score-board {
            position: absolute;
            top: 12px; left: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            z-index: 5;
            background: #262626;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #ff6600;
        }
        .score-board span { color: #ff6600; }
        .discount-badge {
            margin-top: 15px;
            padding: 12px 18px;
            background: #262626;
            border: 1px solid #ff6600;
            border-radius: 8px;
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="score-board">ALTURA: <span id="score">0</span>m</div>
    <canvas id="canvas" width="400" height="650"></canvas>
    
    <div id="start-screen" class="overlay">
        <h1>PRO GLASS JUMP</h1>
        <p>Toca la mitad <b>IZQUIERDA</b> o <b>DERECHA</b> de la pantalla para moverte.</p>
        <p style="color: #ff6600; font-size: 13px;">⚠️ Cristales fisurados: dan <b>UN SOLO SALTO</b> antes de destruirse.</p>
        <button class="btn" onclick="startGame()">¡JUGAR!</button>
    </div>

    <div id="gameover-screen" class="overlay" style="display: none;">
        <h1>¡TE HAS CAÍDO!</h1>
        <p>Alcanzaste una altura de: <br><strong id="final-score" style="font-size: 26px; color: #ff6600;">0m</strong></p>
        <div id="prize-info" class="discount-badge"></div>
        <button class="btn" style="margin-top: 20px;" onclick="startGame()">REINTENTAR</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('final-score');
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const prizeInfo = document.getElementById('prize-info');

    let player, platforms, score, cameraY, gameRunning, keys, particles;

    class Player {
        constructor() {
            this.width = 28;
            this.height = 28;
            this.x = canvas.width / 2 - 14;
            this.y = canvas.height - 120;
            this.vy = 0;
            this.vx = 0;
            this.jumpForce = -11.5;
            this.gravity = 0.42;
        }

        draw() {
            ctx.fillStyle = '#ff6600';
            ctx.beginPath();
            ctx.arc(this.x + 14, this.y - cameraY + 14, 14, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(this.x + 9, this.y - cameraY + 9, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        update() {
            this.vy += this.gravity;
            this.y += this.vy;
            this.x += this.vx;

            if (this.x < -this.width) this.x = canvas.width;
            if (this.x > canvas.width) this.x = -this.width;
        }
    }

    class Platform {
        constructor(x, y, isCracked = false) {
            this.x = x;
            this.y = y;
            this.width = 80;
            this.height = 18;
            this.isCracked = isCracked;
            this.broken = false;
        }

        draw() {
            if (this.broken) return;

            ctx.save();
            ctx.translate(this.x, this.y - cameraY);

            if (this.isCracked) {
                ctx.fillStyle = 'rgba(255, 102, 0, 0.25)';
                ctx.strokeStyle = '#ff6600';
                ctx.lineWidth = 2;
                this.drawWindshieldShape();

                ctx.strokeStyle = '#ffa366';
                ctx.beginPath();
                ctx.moveTo(15, 5); ctx.lineTo(40, 12); ctx.lineTo(65, 4);
                ctx.moveTo(30, 14); ctx.lineTo(45, 3);
                ctx.stroke();
            } else {
                ctx.fillStyle = '#262626';
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 2;
                this.drawWindshieldShape();

                ctx.fillStyle = '#000000';
                ctx.fillRect(4, 2, this.width - 8, 3);
            }

            ctx.restore();
        }

        drawWindshieldShape() {
            ctx.beginPath();
            ctx.moveTo(8, 0);
            ctx.lineTo(this.width - 8, 0);
            ctx.quadraticCurveTo(this.width, 0, this.width, 6);
            ctx.lineTo(this.width - 4, this.height - 4);
            ctx.quadraticCurveTo(this.width - 6, this.height, this.width - 12, this.height);
            ctx.lineTo(12, this.height);
            ctx.quadraticCurveTo(6, this.height, 4, this.height - 4);
            ctx.lineTo(0, 6);
            ctx.quadraticCurveTo(0, 0, 8, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
    }

    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = (Math.random() - 0.5) * 6;
            this.size = Math.random() * 4 + 2;
            this.life = 25;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life--;
        }

        draw() {
            ctx.fillStyle = '#ff6600';
            ctx.fillRect(this.x, this.y - cameraY, this.size, this.size);
        }
    }

    function drawBackgroundText() {
        ctx.save();
        ctx.fillStyle = '#222222';
        ctx.font = '900 32px "Segoe UI", Roboto, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        let startY = - (cameraY * 0.3) % 200;
        for (let y = startY - 200; y < canvas.height + 200; y += 200) {
            ctx.fillText('PRO GLASS JUMP', canvas.width / 2, y);
        }
        ctx.restore();
    }

    function init() {
        player = new Player();
        platforms = [];
        particles = [];
        score = 0;
        cameraY = 0;
        keys = {};

        platforms.push(new Platform(canvas.width / 2 - 40, canvas.height - 50, false));

        for (let i = 0; i < 9; i++) {
            let x = Math.random() * (canvas.width - 80);
            let y = canvas.height - 115 - (i * 65);
            let isCracked = i > 1 && Math.random() < 0.25;
            platforms.push(new Platform(x, y, isCracked));
        }
    }

    function startGame() {
        init();
        gameRunning = true;
        startScreen.style.display = 'none';
        gameoverScreen.style.display = 'none';
        loop();
    }

    function createBreakParticles(x, y) {
        for (let i = 0; i < 15; i++) {
            particles.push(new Particle(x + 40, y + 9));
        }
    }

    function gameOver() {
        gameRunning = false;
        finalScoreEl.innerText = score + 'm';
        
        if(score >= 1000) {
            prizeInfo.innerText = "🎉 ¡Ganaste un 5% de Descuento!";
        } else if(score >= 600) {
            prizeInfo.innerText = "🎉 ¡Ganaste un 3% de Descuento!";
        } else if(score >= 300) {
            prizeInfo.innerText = "🎉 ¡Ganaste un 2% de Descuento!";
        } else {
            prizeInfo.innerText = "¡Sigue intentándolo para alcanzar un descuento!";
        }

        gameoverScreen.style.display = 'flex';
    }

    function loop() {
        if (!gameRunning) return;

        if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -5.5;
        else if (keys['ArrowRight'] || keys['KeyD']) player.vx = 5.5;

        player.update();

        if (player.y - cameraY < canvas.height / 2) {
            cameraY = player.y - cameraY < canvas.height / 2 ? player.y - canvas.height / 2 : cameraY;
            score = Math.max(score, Math.floor((canvas.height - 120 - player.y) / 10));
            scoreEl.innerText = score;
        }

        if (player.vy > 0) {
            platforms.forEach(p => {
                if (!p.broken &&
                    player.x + player.width > p.x &&
                    player.x < p.x + p.width &&
                    player.y + player.height >= p.y &&
                    player.y + player.height <= p.y + p.height + player.vy
                ) {
                    player.vy = player.jumpForce;
                    
                    if (p.isCracked) {
                        p.broken = true;
                        createBreakParticles(p.x, p.y);
                    }
                }
            });
        }

        let highestPlatform = platforms[platforms.length - 1];
        if (highestPlatform.y - cameraY > -100) {
            let x = Math.random() * (canvas.width - 80);
            let y = highestPlatform.y - 65;
            let isCracked = Math.random() < 0.25;
            platforms.push(new Platform(x, y, isCracked));
        }

        platforms = platforms.filter(p => p.y - cameraY < canvas.height + 50);
        particles.forEach(p => p.update());
        particles = particles.filter(p => p.life > 0);

        if (player.y - cameraY > canvas.height) {
            gameOver();
            return;
        }

        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawBackgroundText();

        platforms.forEach(p => p.draw());
        particles.forEach(p => p.draw());
        player.draw();

        requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    window.addEventListener('touchstart', e => {
        let touchX = e.touches[0].clientX;
        let screenWidth = window.innerWidth;
        if (touchX < screenWidth / 2) player.vx = -5.5;
        else player.vx = 5.5;
    });

    window.addEventListener('touchend', () => player.vx = 0);
</script>

</body>
</html>
