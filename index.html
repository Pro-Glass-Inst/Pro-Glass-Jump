<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pro Glass Jump</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 650px;
            background-color: #0b132b;
            border: 3px solid #e63946;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 19, 43, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
            z-index: 10;
        }
        h1 { 
            color: #ffffff; 
            font-size: 26px; 
            font-weight: 800;
            margin-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(230, 57, 70, 0.6);
        }
        p { color: #e0e1dd; font-size: 14px; margin-bottom: 15px; line-height: 1.4; }
        .btn {
            background-color: #e63946;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .btn:active { background-color: #c1121f; }
        .score-board {
            position: absolute;
            top: 12px; left: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            z-index: 5;
            background: #1c2541;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #48cae4;
        }
        .score-board span { color: #48cae4; }
        .discount-badge {
            margin-top: 10px;
            padding: 10px 16px;
            background: #1c2541;
            border: 1px solid #e63946;
            border-radius: 8px;
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
        }

        .logo-container {
            position: relative;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .brand-badge {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid #48cae4;
            background: #1c2541;
            color: #ffffff;
            font-weight: 900;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 0 15px rgba(72, 202, 228, 0.4);
            z-index: 2;
            padding: 10px;
            line-height: 1.2;
        }
        .star {
            position: absolute;
            font-size: 20px;
            color: #ffd700;
            opacity: 0;
            pointer-events: none;
            z-index: 3;
            animation: twinkle 1.2s infinite ease-in-out alternate;
        }
        .star-1 { top: -10px; left: -10px; animation-delay: 0s; }
        .star-2 { top: -15px; right: -10px; animation-delay: 0.3s; }
        .star-3 { bottom: -10px; left: -15px; animation-delay: 0.6s; }
        .star-4 { bottom: -10px; right: -15px; animation-delay: 0.9s; }
        .star-5 { top: 35px; left: -25px; animation-delay: 0.4s; }
        .star-6 { top: 35px; right: -25px; animation-delay: 0.7s; }

        @keyframes twinkle {
            0% { transform: scale(0.6) rotate(0deg); opacity: 0.2; }
            100% { transform: scale(1.3) rotate(20deg); opacity: 1; filter: drop-shadow(0 0 6px #ffd700); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="score-board">ALTURA: <span id="score">0</span>m</div>
    <canvas id="canvas" width="400" height="650"></canvas>
    
    <div id="start-screen" class="overlay">
        <div class="logo-container">
            <div class="brand-badge">PRO GLASS</div>
        </div>
        <h1>PRO GLASS JUMP</h1>
        <p>Toca <b>IZQUIERDA</b> o <b>DERECHA</b> para moverte.</p>
        <p style="color: #e63946; font-size: 13px; font-weight: bold;">⚠️ ¡Dificultad progresiva extrema! Supera los 1000m si puedes.</p>
        <button class="btn" onclick="startGame()">¡JUGAR!</button>
    </div>

    <div id="gameover-screen" class="overlay" style="display: none;">
        <div class="logo-container" id="stars-group" style="display: none; height: 30px;">
            <span class="star star-1">★</span>
            <span class="star star-2">✦</span>
            <span class="star star-3">★</span>
            <span class="star star-4">✦</span>
            <span class="star star-5">✨</span>
            <span class="star star-6">✨</span>
        </div>
        <h1>¡FIN DEL JUEGO!</h1>
        <p>Alcanzaste una altura de: <br><strong id="final-score" style="font-size: 26px; color: #48cae4;">0m</strong></p>
        <div id="prize-info" class="discount-badge"></div>
        <button class="btn" style="margin-top: 15px;" onclick="startGame()">REINTENTAR</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('final-score');
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const prizeInfo = document.getElementById('prize-info');
    const starsGroup = document.getElementById('stars-group');

    let player, platforms, score, cameraY, gameRunning, keys, particles, lastPlatformY, lastPlatformX, lastWasCracked;

    class Player {
        constructor() {
            this.width = 24;
            this.height = 24;
            this.x = canvas.width / 2 - 12;
            this.y = canvas.height - 120;
            this.vy = 0;
            this.vx = 0;
            this.jumpForce = -12.5;
            this.gravity = 0.45;
        }

        draw() {
            ctx.fillStyle = '#e63946';
            ctx.beginPath();
            ctx.arc(this.x + 12, this.y - cameraY + 12, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(this.x + 8, this.y - cameraY + 8, 3.5, 0, Math.PI * 2);
            ctx.fill();
        }

        update() {
            this.vy += this.gravity;
            this.y += this.vy;
            this.x += this.vx;

            if (this.x < -this.width) this.x = canvas.width;
            if (this.x > canvas.width) this.x = -this.width;
        }
    }

    class Platform {
        constructor(x, y, isCracked = false, moveSpeed = 0, isSmall = false) {
            this.x = x;
            this.y = y;
            this.width = isSmall ? 55 : 75;
            this.height = 16;
            this.isCracked = isCracked;
            this.broken = false;
            this.moveSpeed = moveSpeed;
            this.direction = Math.random() < 0.5 ? 1 : -1;
        }

        update() {
            if (this.moveSpeed > 0) {
                this.x += this.moveSpeed * this.direction;
                if (this.x <= 0) {
                    this.x = 0;
                    this.direction = 1;
                } else if (this.x + this.width >= canvas.width) {
                    this.x = canvas.width - this.width;
                    this.direction = -1;
                }
            }
        }

        draw() {
            if (this.broken) return;

            ctx.save();
            ctx.translate(this.x, this.y - cameraY);

            if (this.isCracked) {
                ctx.fillStyle = 'rgba(230, 57, 70, 0.25)';
                ctx.strokeStyle = '#e63946';
                ctx.lineWidth = 2;
                this.drawWindshieldShape();

                ctx.strokeStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(10, 4); ctx.lineTo(this.width * 0.5, 10); ctx.lineTo(this.width - 10, 3);
                ctx.stroke();
            } else {
                ctx.fillStyle = '#1c2541';
                ctx.strokeStyle = '#e0e1dd';
                ctx.lineWidth = 2;
                this.drawWindshieldShape();

                ctx.fillStyle = '#48cae4';
                ctx.fillRect(4, 2, Math.max(0, this.width - 8), 3);
            }

            ctx.restore();
        }

        drawWindshieldShape() {
            ctx.beginPath();
            ctx.moveTo(6, 0);
            ctx.lineTo(this.width - 6, 0);
            ctx.quadraticCurveTo(this.width, 0, this.width, 5);
            ctx.lineTo(this.width - 3, this.height - 3);
            ctx.quadraticCurveTo(this.width - 5, this.height, this.width - 10, this.height);
            ctx.lineTo(10, this.height);
            ctx.quadraticCurveTo(5, this.height, 3, this.height - 3);
            ctx.lineTo(0, 5);
            ctx.quadraticCurveTo(0, 0, 6, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
    }

    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = (Math.random() - 0.5) * 6;
            this.size = Math.random() * 4 + 2;
            this.life = 25;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life--;
        }

        draw() {
            ctx.fillStyle = '#e63946';
            ctx.fillRect(this.x, this.y - cameraY, this.size, this.size);
        }
    }

    function drawBackgroundText() {
        ctx.save();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.font = '900 42px "Segoe UI", Roboto, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        let startY = - (cameraY * 0.3) % 220;
        for (let y = startY - 220; y < canvas.height + 220; y += 220) {
            ctx.fillText('PRO GLASS JUMP', canvas.width / 2, y);
        }
        ctx.restore();
    }

    function init() {
        player = new Player();
        platforms = [];
        particles = [];
        score = 0;
        cameraY = 0;
        keys = {};
        lastWasCracked = false;

        lastPlatformX = canvas.width / 2 - 40;
        lastPlatformY = canvas.height - 50;
        platforms.push(new Platform(lastPlatformX, lastPlatformY, false, 0, false));

        for (let i = 0; i < 9; i++) {
            lastPlatformY -= 60;
            let maxOffset = 140;
            let minX = Math.max(10, lastPlatformX - maxOffset);
            let maxX = Math.min(canvas.width - 85, lastPlatformX + maxOffset);
            lastPlatformX = Math.random() * (maxX - minX) + minX;

            platforms.push(new Platform(lastPlatformX, lastPlatformY, false, 0, false));
        }
    }

    function startGame() {
        init();
        gameRunning = true;
        startScreen.style.display = 'none';
        gameoverScreen.style.display = 'none';
        loop();
    }

    function createBreakParticles(x, y, width) {
        for (let i = 0; i < 15; i++) {
            particles.push(new Particle(x + (width / 2), y + 8));
        }
    }

    function gameOver() {
        gameRunning = false;
        finalScoreEl.innerText = score + 'm';
        
        if(score >= 300) {
            starsGroup.style.display = 'flex';
            
            if(score >= 1000) {
                prizeInfo.innerText = "🏆 ¡INCREÍBLE! Ganaste el 5% de Descuento";
            } else if(score >= 600) {
                prizeInfo.innerText = "🎉 ¡Excelente! Ganaste un 3% de Descuento";
            } else {
                prizeInfo.innerText = "🎉 ¡Bien hecho! Ganaste un 2% de Descuento";
            }
        } else {
            starsGroup.style.display = 'none';
            prizeInfo.innerText = "¡Casi! Sigue practicando para ganar tu descuento.";
        }

        gameoverScreen.style.display = 'flex';
    }

    function loop() {
        if (!gameRunning) return;

        if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -7.0;
        else if (keys['ArrowRight'] || keys['KeyD']) player.vx = 7.0;

        player.update();

        if (player.y - cameraY < canvas.height / 2) {
            cameraY = player.y - canvas.height / 2;
            score = Math.max(score, Math.floor((canvas.height - 120 - player.y) / 10));
            scoreEl.innerText = score;
        }

        platforms.forEach(p => p.update());

        if (player.vy > 0) {
            platforms.forEach(p => {
                if (!p.broken &&
                    player.x + player.width > p.x &&
                    player.x < p.x + p.width &&
                    player.y + player.height >= p.y &&
                    player.y + player.height <= p.y + p.height + player.vy
                ) {
                    player.vy = player.jumpForce;
                    
                    if (p.isCracked) {
                        p.broken = true;
                        createBreakParticles(p.x, p.y, p.width);
                    }
                }
            });
        }

        while (lastPlatformY - cameraY > -100) {
            lastPlatformY -= 60;

            let isCracked = false;
            if (!lastWasCracked) {
                let crackedChance = Math.min(0.08 + (score / 1500), 0.35);
                isCracked = Math.random() < crackedChance;
            }
            lastWasCracked = isCracked;

            let moveSpeed = 0;
            if (score > 200 && Math.random() < Math.min(0.2 + (score / 1500), 0.5)) {
                moveSpeed = 1.2 + Math.min(score / 500, 1.8);
            }

            let isSmall = score > 400 && Math.random() < Math.min((score - 400) / 1000, 0.4);
            let width = isSmall ? 55 : 75;

            let maxOffset = 150;
            let minX = Math.max(10, lastPlatformX - maxOffset);
            let maxX = Math.min(canvas.width - width - 10, lastPlatformX + maxOffset);
            lastPlatformX = Math.random() * (maxX - minX) + minX;

            platforms.push(new Platform(lastPlatformX, lastPlatformY, isCracked, moveSpeed, isSmall));
        }

        platforms = platforms.filter(p => p.y - cameraY < canvas.height + 50);
        particles.forEach(p => p.update());
        particles = particles.filter(p => p.life > 0);

        if (player.y - cameraY > canvas.height) {
            gameOver();
            return;
        }

        ctx.fillStyle = '#0b132b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawBackgroundText();

        platforms.forEach(p => p.draw());
        particles.forEach(p => p.draw());
        player.draw();

        requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    window.addEventListener('touchstart', e => {
        let touchX = e.touches[0].clientX;
        let screenWidth = window.innerWidth;
        if (touchX < screenWidth / 2) player.vx = -7.0;
        else player.vx = 7.0;
    });

    window.addEventListener('touchend', () => player.vx = 0);
</script>

</body>
</html>
