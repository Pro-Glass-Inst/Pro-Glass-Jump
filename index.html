<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pro Glass Jump</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 650px;
            background-color: #0b132b;
            border: 3px solid #e63946;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 19, 43, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
            z-index: 10;
        }
        h1 { 
            color: #ffffff; 
            font-size: 28px; 
            font-weight: 800;
            margin-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(230, 57, 70, 0.6);
        }
        p { color: #e0e1dd; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
        .btn {
            background-color: #e63946;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 14px 32px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .btn:active { background-color: #c1121f; }
        .score-board {
            position: absolute;
            top: 12px; left: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            z-index: 5;
            background: #1c2541;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #48cae4;
        }
        .score-board span { color: #48cae4; }
        .discount-badge {
            margin-top: 15px;
            padding: 12px 18px;
            background: #1c2541;
            border: 1px solid #e63946;
            border-radius: 8px;
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="score-board">ALTURA: <span id="score">0</span>m</div>
    <canvas id="canvas" width="400" height="650"></canvas>
    
    <div id="start-screen" class="overlay">
        <h1>PRO GLASS JUMP</h1>
        <p>Toca <b>IZQUIERDA</b> o <b>DERECHA</b> para moverte.</p>
        <p style="color: #e63946; font-size: 13px; font-weight: bold;">⚠️ ¡Dificultad progresiva extrema! Supera los 1000m si puedes.</p>
        <button class="btn" onclick="startGame()">¡JUGAR!</button>
    </div>

    <div id="gameover-screen" class="overlay" style="display: none;">
        <h1>¡TE HAS CAÍDO!</h1>
        <p>Alcanzaste una altura de: <br><strong id="final-score" style="font-size: 26px; color: #48cae4;">0m</strong></p>
        <div id="prize-info" class="discount-badge"></div>
        <button class="btn" style="margin-top: 20px;" onclick="startGame()">REINTENTAR</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('final-score');
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const prizeInfo = document.getElementById('prize-info');

    let player, platforms, score, cameraY, gameRunning, keys, particles;

    class Player {
        constructor() {
            this.width = 24;
            this.height = 24;
            this.x = canvas.width / 2 - 12;
            this.y = canvas.height - 120;
            this.vy = 0;
            this.vx = 0;
            this.jumpForce = -11.0;
            this.gravity = 0.48;
        }

        draw() {
            // Esfera Roja con borde blanco y destello
            ctx.fillStyle = '#e63946';
            ctx.beginPath();
            ctx.arc(this.x + 12, this.y - cameraY + 12, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(this.x + 8, this.y - cameraY + 8, 3.5, 0, Math.PI * 2);
            ctx.fill();
        }

        update() {
            this.vy += this.gravity;
            this.y += this.vy;
            this.x += this.vx;

            if (this.x < -this.width) this.x = canvas.width;
            if (this.x > canvas.width) this.x = -this.width;
        }
    }

    class Platform {
        constructor(x, y, isCracked = false, moveSpeed = 0, isSmall = false) {
            this.x = x;
            this.y = y;
            this.width = isSmall ? 50 : 75; // Reducción de ancho en niveles altos
            this.height = 16;
            this.isCracked = isCracked;
            this.broken = false;
            this.moveSpeed = moveSpeed;
            this.direction = Math.random() < 0.5 ? 1 : -1;
        }

        update() {
            if (this.moveSpeed > 0) {
                this.x += this.moveSpeed * this.direction;
                if (this.x <= 0) {
                    this.x = 0;
                    this.direction = 1;
                } else if (this.x + this.width >= canvas.width) {
                    this.x = canvas.width - this.width;
                    this.direction = -1;
                }
            }
        }

        draw() {
            if (this.broken) return;

            ctx.save();
            ctx.translate(this.x, this.y - cameraY);

            if (this.isCracked) {
                // Parabrisas Fisurado: Tono rojo transparente con fisuras blancas
                ctx.fillStyle = 'rgba(230, 57, 70, 0.25)';
                ctx.strokeStyle = '#e63946';
                ctx.lineWidth = 2;
                this.drawWindshieldShape();

                ctx.strokeStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(10, 4); ctx.lineTo(this.width * 0.5, 10); ctx.lineTo(this.width - 10, 3);
                ctx.stroke();
            } else {
                // Parabrisas Seguro: Marco plateado/blanco con franja azul
                ctx.fillStyle = '#1c2541';
                ctx.strokeStyle = '#e0e1dd';
                ctx.lineWidth = 2;
                this.drawWindshieldShape();

                ctx.fillStyle = '#48cae4';
                ctx.fillRect(4, 2, Math.max(0, this.width - 8), 3);
            }

            ctx.restore();
        }

        drawWindshieldShape() {
            ctx.beginPath();
            ctx.moveTo(6, 0);
            ctx.lineTo(this.width - 6, 0);
            ctx.quadraticCurveTo(this.width, 0, this.width, 5);
            ctx.lineTo(this.width - 3, this.height - 3);
            ctx.quadraticCurveTo(this.width - 5, this.height, this.width - 10, this.height);
            ctx.lineTo(10, this.height);
            ctx.quadraticCurveTo(5, this.height, 3, this.height - 3);
            ctx.lineTo(0, 5);
            ctx.quadraticCurveTo(0, 0, 6, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
    }

    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = (Math.random() - 0.5) * 6;
            this.size = Math.random() * 4 + 2;
            this.life = 25;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life--;
        }

        draw() {
            ctx.fillStyle = '#e63946';
            ctx.fillRect(this.x, this.y - cameraY, this.size, this.size);
        }
    }

    function drawBackgroundText() {
        ctx.save();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.font = '900 42px "Segoe UI", Roboto, sans-serif'; // Texto más grande y visible
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        let startY = - (cameraY * 0.3) % 220;
        for (let y = startY - 220; y < canvas.height + 220; y += 220) {
            ctx.fillText('PRO GLASS JUMP', canvas.width / 2, y);
        }
        ctx.restore();
    }

    function init() {
        player = new Player();
        platforms = [];
        particles = [];
        score = 0;
        cameraY = 0;
        keys = {};

        platforms.push(new Platform(canvas.width / 2 - 40, canvas.height - 50, false, 0, false));

        let currentY = canvas.height - 130;
        for (let i = 0; i < 8; i++) {
            let x = Math.random() * (canvas.width - 75);
            platforms.push(new Platform(x, currentY, false, 0, false));
            currentY -= 75;
        }
    }

    function startGame() {
        init();
        gameRunning = true;
        startScreen.style.display = 'none';
        gameoverScreen.style.display = 'none';
        loop();
    }

    function createBreakParticles(x, y, width) {
        for (let i = 0; i < 15; i++) {
            particles.push(new Particle(x + (width / 2), y + 8));
        }
    }

    function gameOver() {
        gameRunning = false;
        finalScoreEl.innerText = score + 'm';
        
        if(score >= 1000) {
            prizeInfo.innerText = "🏆 ¡INCREÍBLE! Ganaste el 5% de Descuento";
        } else if(score >= 600) {
            prizeInfo.innerText = "🎉 ¡Excelente! Ganaste un 3% de Descuento";
        } else if(score >= 300) {
            prizeInfo.innerText = "🎉 ¡Bien hecho! Ganaste un 2% de Descuento";
        } else {
            prizeInfo.innerText = "¡Casi! Sigue practicando para ganar tu descuento.";
        }

        gameoverScreen.style.display = 'flex';
    }

    function loop() {
        if (!gameRunning) return;

        if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -5.0;
        else if (keys['ArrowRight'] || keys['KeyD']) player.vx = 5.0;

        player.update();

        if (player.y - cameraY < canvas.height / 2) {
            cameraY = player.y - cameraY < canvas.height / 2 ? player.y - canvas.height / 2 : cameraY;
            score = Math.max(score, Math.floor((canvas.height - 120 - player.y) / 10));
            scoreEl.innerText = score;
        }

        platforms.forEach(p => p.update());

        if (player.vy > 0) {
            platforms.forEach(p => {
                if (!p.broken &&
                    player.x + player.width > p.x &&
                    player.x < p.x + p.width &&
                    player.y + player.height >= p.y &&
                    player.y + player.height <= p.y + p.height + player.vy
                ) {
                    player.vy = player.jumpForce;
                    
                    if (p.isCracked) {
                        p.broken = true;
                        createBreakParticles(p.x, p.y, p.width);
                    }
                }
            });
        }

        // LÓGICA DE DIFICULTAD PROGRESIVA
        let highestPlatform = platforms[platforms.length - 1];
        if (highestPlatform.y - cameraY > -100) {
            // 1. La distancia entre plataformas aumenta gradualmente (75px a 115px)
            let gap = 75 + Math.min(score / 15, 40); 
            let y = highestPlatform.y - gap;

            // 2. Probabilidad de cristal falso/rotación sube hasta un 65%
            let crackedChance = Math.min(0.10 + (score / 1200), 0.65);
            let isCracked = Math.random() < crackedChance;

            // 3. Velocidad de plataformas móviles tras los 200m
            let moveSpeed = 0;
            if (score > 200 && Math.random() < Math.min(0.2 + (score / 1500), 0.7)) {
                moveSpeed = 1.2 + Math.min(score / 400, 2.5);
            }

            // 4. Aparición de plataformas angostas (50px) tras los 350m
            let isSmall = score > 350 && Math.random() < Math.min((score - 350) / 1000, 0.6);

            let width = isSmall ? 50 : 75;
            let x = Math.random() * (canvas.width - width);

            platforms.push(new Platform(x, y, isCracked, moveSpeed, isSmall));
        }

        platforms = platforms.filter(p => p.y - cameraY < canvas.height + 50);
        particles.forEach(p => p.update());
        particles = particles.filter(p => p.life > 0);

        if (player.y - cameraY > canvas.height) {
            gameOver();
            return;
        }

        // Fondo Azul Profundo
        ctx.fillStyle = '#0b132b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawBackgroundText();

        platforms.forEach(p => p.draw());
        particles.forEach(p => p.draw());
        player.draw();

        requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    window.addEventListener('touchstart', e => {
        let touchX = e.touches[0].clientX;
        let screenWidth = window.innerWidth;
        if (touchX < screenWidth / 2) player.vx = -5.0;
        else player.vx = 5.0;
    });

    window.addEventListener('touchend', () => player.vx = 0);
</script>

</body>
</html>
